<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | NestFind</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            font-family: "Poppins", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fb;
        }

        .admin-login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .admin-login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.09);
        }

        .admin-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #212529;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .admin-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 5px;
        }

        .admin-subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #343a40;
        }

        .input-group-text {
            background: #ffffff;
            color: #6c757d;
            border-right: none;
        }

        .form-control {
            height: 48px;
            border-left: none;
            font-size: 14px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #86b7fe;
        }

        .input-group:focus-within .input-group-text {
            border-color: #86b7fe;
            color: #0d6efd;
        }

        .password-toggle {
            cursor: pointer;
            border-left: none;
        }

        .password-toggle:hover {
            color: #0d6efd;
        }

        .login-btn {
            height: 50px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
        }

        .back-home {
            text-align: center;
            margin-top: 22px;
        }

        .back-home a {
            text-decoration: none;
            color: #6c757d;
            font-size: 14px;
        }

        .back-home a:hover {
            color: #0d6efd;
        }

        .alert {
            font-size: 14px;
            border-radius: 8px;
        }

        .admin-badge {
            text-align: center;
            margin-bottom: 20px;
        }

        .admin-badge span {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 50px;
            background: #f1f3f5;
            color: #495057;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 576px) {

            .admin-login-card {
                padding: 30px 22px;
            }

            .admin-title {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>


<div class="admin-login-wrapper">

    <div class="admin-login-card">


        <!-- ADMIN ICON -->

        <div class="admin-logo">

            <i class="fa-solid fa-user-shield"></i>

        </div>


        <div class="admin-badge">

            <span>
                <i class="fa-solid fa-lock me-1"></i>
                ADMIN PANEL
            </span>

        </div>


        <h1 class="admin-title">
            NestFind Admin
        </h1>

        <p class="admin-subtitle">
            Sign in to manage properties and enquiries
        </p>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="alert alert-{{ category if category in ['success', 'danger', 'warning', 'info'] else 'info' }} alert-dismissible fade show"
                        role="alert"
                    >

                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close"
                        ></button>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- ADMIN LOGIN FORM -->

        <form
            method="POST"
            action="{{ url_for('admin_login') }}"
        >


            <!-- CSRF TOKEN -->

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <!-- USERNAME -->

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label"
                >
                    Username
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fa-solid fa-user"></i>

                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fa-solid fa-lock"></i>

                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                    <span
                        class="input-group-text password-toggle"
                        id="togglePassword"
                        title="Show password"
                    >

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-dark w-100 login-btn"
            >

                <i class="fa-solid fa-right-to-bracket me-2"></i>

                Admin Login

            </button>


        </form>


        <!-- BACK TO WEBSITE -->

        <div class="back-home">

            <a href="{{ url_for('home') }}">

                <i class="fa-solid fa-arrow-left me-1"></i>

                Back to NestFind

            </a>

        </div>


    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    const password =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");


    togglePassword.addEventListener("click", function () {

        const icon =
            this.querySelector("i");


        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

            this.setAttribute(
                "title",
                "Hide password"
            );

        } else {

            password.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

            this.setAttribute(
                "title",
                "Show password"
            );

        }

    });

</script>


</body>

</html>
